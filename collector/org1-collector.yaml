receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform:
    trace_statements:
      - set(span.attributes["peer.trace.url"], Concat(["https://ORG2_DT_ENV_ID_PLACEHOLDER.apps.dynatrace.com/ui/apps/dynatrace.distributedtracing/explorer?filter=trace.id+%3D+", span.trace_id.string], "")) where span.attributes["http.url"] == "http://localhost:9002/"

exporters:
  otlphttp:
    endpoint: https://${env:DT_ENV1_ID}.live.dynatrace.com/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_ENV1_INGEST_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform]
      exporters: [otlphttp]
